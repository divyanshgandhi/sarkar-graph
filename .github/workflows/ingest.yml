# Runs on GitHub Actions; see README "How it works".
# Keeps the news archive (Latest news + Power map) growing between deploys.
# "Git scraping": fetch feeds every 30 minutes and commit the archive when it changes.
name: ingest-news
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 11.1.0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: node --experimental-strip-types scripts/ingest-news.ts
      - name: Commit archive
        run: |
          git config user.name "sarkar-graph-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/news/store.json public/data/live/snapshot.json
          git diff --cached --quiet || git commit -m "news: $(date -u +%Y-%m-%dT%H:%MZ)"
          git push
